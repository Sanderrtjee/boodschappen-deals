# Home Assistant basisimages op Alpine 3.21, want daar zit nodejs 22 in.
# Alleen images uit de home-assistant-namespace worden door de Supervisor
# geaccepteerd; bij iets anders valt hij stil terug op zijn eigen basisimage
# zonder Node erin.
build_from:
  amd64: ghcr.io/home-assistant/amd64-base:3.21
  aarch64: ghcr.io/home-assistant/aarch64-base:3.21
  armv7: ghcr.io/home-assistant/armv7-base:3.21
labels:
  org.opencontainers.image.title: Boodschappen Deals
  org.opencontainers.image.description: Supermarktaanbiedingen gefilterd op profiel
